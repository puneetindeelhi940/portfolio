<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Dell laptop">
  <defs>
    <linearGradient id="lap-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f9"/>
      <stop offset="1" stop-color="#d3e0ef"/>
    </linearGradient>
  </defs>
  <!-- screen -->
  <rect x="96" y="56" width="208" height="150" rx="10" fill="url(#lap-screen)" stroke="#7d94b3" stroke-width="3"/>
  <rect x="110" y="70" width="180" height="122" rx="5" fill="#0672CB" opacity="0.10"/>
  <!-- UI content lines -->
  <rect x="124" y="88" width="72" height="9" rx="4.5" fill="#0672CB" opacity="0.7"/>
  <rect x="124" y="108" width="132" height="7" rx="3.5" fill="#8aa1bd"/>
  <rect x="124" y="124" width="108" height="7" rx="3.5" fill="#8aa1bd"/>
  <rect x="124" y="140" width="120" height="7" rx="3.5" fill="#8aa1bd"/>
  <!-- base / deck -->
  <path d="M66 212 h268 l26 30 H40 z" fill="#d3dce7" stroke="#7d94b3" stroke-width="3" stroke-linejoin="round"/>
  <!-- trackpad notch -->
  <rect x="174" y="218" width="52" height="7" rx="3.5" fill="#7d94b3"/>
</svg>
