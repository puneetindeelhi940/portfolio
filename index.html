<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puneet Arora · Portfolio</title>
<meta name="description" content="Private portfolio of Puneet Arora — Principal Product Designer.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('pa-theme');if(t==='forest')document.documentElement.setAttribute('data-theme','forest');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main id="gate-root" class="gate">
  <div class="gate__bg">
    <canvas id="gate-globe" class="gate__globe" aria-hidden="true"></canvas>
  </div>

  <div class="gate__inner">
    <div class="gate__brand">
      <span class="dot"></span>
      <b>Puneet Arora</b>
      
    </div>

    <h1 class="gate__title">
      <em>Grow the Core while Adding some More.</em>
    </h1>
    <p class="gate__tagline">Portfolio for an AI-driven future</p>
    <p class="gate__lede">
      Step inside to explore the work. Want to talk? Reach
      out on <a href="https://www.linkedin.com/in/puneetar/" target="_blank" rel="noopener" style="color: var(--signal);">LinkedIn</a>
      or via <a href="mailto:puneetindelhi@yahoo.com" style="color: var(--signal);">email</a>.
    </p>

    <form id="gate-form" class="gate__form" autocomplete="off" novalidate>
      <button type="submit" class="gate__submit">ENTER →</button>
    </form>

    <div class="gate__theme">
      <span class="lbl">DISPLAY</span>
      <span class="theme-toggle" role="radiogroup" aria-label="Color theme">
        <button type="button" class="theme-toggle__opt" data-theme-set="default" role="radio" aria-checked="true">DARK</button>
        <button type="button" class="theme-toggle__opt" data-theme-set="forest" role="radio" aria-checked="false">LIGHT</button>
      </span>
    </div>
  </div>

  <div class="gate__foot">
    <span>© <span id="year">2026</span> · PUNEET ARORA · BENGALURU</span>
    <span>v.2026.06 · BUILD-001</span>
  </div>
</main>

<script src="assets/site.js"></script>
<script src="assets/globe-fx.js" defer></script>
</body>
</html>
