document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<div style=\"font: 700 32px/1 'DM Serif Display', serif; color: #6cc96c\">8<\u002Fdiv>\n          <div style=\"font: 400 11px/1.3 'DM Sans', sans-serif; color: rgba(240,236,228,0.45); margin-top: 4px\">Patents<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width: 1px; background: rgba(255,255,255,0.08)\"><\u002Fdiv>\n        <div style=\"text-align: center\">\n          <div style=\"font: 700 32px/1 'DM Serif Display', serif; color: #6cc96c\">9<\u002Fdiv>\n          <div style=\"font: 400 11px/1.3 'DM Sans', sans-serif; color: rgba(240,236,228,0.45); margin-top: 4px\">AI projects live<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PROCESS -->\n  <section class=\"fade-in\" style=\"padding: 60px 24px; border-top: 1px solid rgba(74,138,78,0.08)\">\n    <div style=\"text-align: center; margin-bottom: 48px\">\n      <div style=\"font: 400 12px/1 'DM Sans', sans-serif; color: #6cc96c; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px\">The Loop<\u002Fdiv>\n      <h2 class=\"section-h2\" style=\"font: 400 42px/1.1 'DM Serif Display', serif; color: #f0ece4; margin: 0\">Imagine. Build. Ship.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"process-grid\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px\">\n      <div style=\"background: rgba(74,138,78,0.05); border-radius: 12px 0 0 12px; padding: 40px 32px; position: relative\">\n        <div style=\"font: 700 64px/1 'DM Serif Display', serif; color: rgba(74,138,78,0.1); position: absolute; top: 16px; right: 24px\">1<\u002Fdiv>\n        <div style=\"font: 600 11px/1 'DM Sans', sans-serif; color: #6cc96c; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px\">Imagine<\u002Fdiv>\n        <h3 style=\"font: 500 18px/1.3 'DM Sans', sans-serif; color: #f0ece4; margin: 0 0 8px\">See the problem differently<\u002Fh3>\n        <p style=\"font: 400 13px/1.6 'DM Sans', sans-serif; color: rgba(240,236,228,0.5); margin: 0\">Start with a question worth answering. The best tools come from real frustrations.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: rgba(184,160,120,0.05); padding: 40px 32px; position: relative\">\n        <div style=\"font: 700 64px/1 'DM Serif Display', serif; color: rgba(184,160,120,0.1); position: absolute; top: 16px; right: 24px\">2<\u002Fdiv>\n        <div style=\"font: 600 11px/1 'DM Sans', sans-serif; color: #c4aa78; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px\">Build<\u002Fdiv>\n        <h3 style=\"font: 500 18px/1.3 'DM Sans', sans-serif; color: #f0ece4; margin: 0 0 8px\">Vibe-code it into existence<\u002Fh3>\n        <p style=\"font: 400 13px/1.6 'DM Sans', sans-serif; color: rgba(240,236,228,0.5); margin: 0\">Design in conversation with AI. Ship working software, not decks.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background: rgba(74,138,78,0.05); border-radius: 0 12px 12px 0; padding: 40px 32px; position: relative\">\n        <div style=\"font: 700 64px/1 'DM Serif Display', serif; color: rgba(74,138,78,0.1); position: absolute; top: 16px; right: 24px\">3<\u002Fdiv>\n        <div style=\"font: 600 11px/1 'DM Sans', sans-serif; color: #6cc96c; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px\">Ship<\u002Fdiv>\n        <h3 style=\"font: 500 18px/1.3 'DM Sans', sans-serif; color: #f0ece4; margin: 0 0 8px\">Send it live<\u002Fh3>\n        <p style=\"font: 400 13px/1.6 'DM Sans', sans-serif; color: rgba(240,236,228,0.5); margin: 0\">The best prototypes become real products. They find users and prove the concept.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA -->\n  <section class=\"fade-in\" style=\"padding: 60px 24px; background: #181a15; border-top: 1px solid rgba(74,138,78,0.08); text-align: center\">\n    <div style=\"display: inline-flex; align-items: center; gap: 8px; background: rgba(74,138,78,0.1); border: 1px solid rgba(74,138,78,0.2); border-radius: 100px; padding: 6px 16px; margin-bottom: 20px\">\n      <div style=\"width: 6px; height: 6px; background: #56b45a; border-radius: 50%\"><\u002Fdiv>\n      <span style=\"font: 500 11px/1 'DM Sans', sans-serif; color: #7dd87d; letter-spacing: 0.06em; text-transform: uppercase\">Open to Opportunities<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-h2\" style=\"font: 400 42px/1.1 'DM Serif Display', serif; color: #f0ece4; margin: 0 0 16px\">Let's build what's next.<\u002Fh2>\n    <p style=\"font: 400 15px/1.6 'DM Sans', sans-serif; color: rgba(240,236,228,0.55); margin: 0 auto 32px; max-width: 440px\">AI design transformation, enterprise UX, or building things that ship.<\u002Fp>\n    <div class=\"cta-buttons\" style=\"display: flex; gap: 12px; justify-content: center\">\n      <a href=\"https://www.linkedin.com/in/arorapuneet11/\" target=\"_blank\" style=\"font: 500 14px/1 'DM Sans', sans-serif; color: #1c1f19; background: #56b45a; padding: 14px 32px; border-radius: 100px; text-decoration: none; cursor: pointer\" style-hover=\"background: #6cc96c\">Connect on LinkedIn<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer class=\"mobile-footer\" style=\"padding: 28px 24px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between\">\n    <div style=\"display: flex; align-items: center; gap: 10px\">\n      <div style=\"width: 24px; height: 24px; background: #4a8a4e; border-radius: 6px; display: flex; align-items: center; justify-content: center; font: 700 10px/1 'DM Serif Display', serif; color: #f0ece4\">P<\u002Fdiv>\n      <span style=\"font: 400 12px/1 'DM Sans', sans-serif; color: rgba(240,236,228,0.7)\">Puneet Arora · UX Practice &amp; AI Design Transformation<\u002Fspan>\n    <\u002Fdiv>\n\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const observer = new IntersectionObserver((entries) => {\n      entries.forEach(entry => {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('visible');\n        }\n      });\n    }, { threshold: 0.15 });\n\n    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));\n    this._observer = observer;\n  }\n\n  componentWillUnmount() {\n    if (this._observer) this._observer.disconnect();\n  }\n\n  renderVals() {\n    return {};\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
