<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portfolio Showcase — PPTX Export</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@300;400;500;700&family=Roboto+Serif:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1c1f1d; font-family: 'Roboto', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  .pptx-slide {
    width: 1440px;
    height: 3000px;
    overflow: hidden;
    position: relative;
    page-break-after: always;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="directions/terminal.jsx"></script>
<script type="text/babel" src="directions/systems.jsx"></script>
<script type="text/babel" src="directions/editorial.jsx"></script>

<script type="text/babel">
const { TerminalHome, SystemsHome, EditorialHome } = window;

function App() {
  return (
    <React.Fragment>
      <section className="pptx-slide" data-slide="0"><TerminalHome /></section>
      <section className="pptx-slide" data-slide="1"><SystemsHome /></section>
      <section className="pptx-slide" data-slide="2"><EditorialHome /></section>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
