<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puneet Arora · Portfolio</title>
<meta name="description" content="Private portfolio of Puneet Arora — Principal UX Designer / Sr. Design Manager (Strategist).">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main id="gate-root" class="gate">
  <div class="gate__bg"></div>

  <div class="gate__inner">
    <div class="gate__brand">
      <span class="dot"></span>
      <b>P.ARORA</b>
      <span class="slash">/ DESIGN.PORTFOLIO</span>
    </div>

    <h1 class="gate__title">
      A private<br>
      <em>working portfolio.</em>
    </h1>
    <p class="gate__lede">
      You have been sent a passcode. Enter it to continue. If you don&rsquo;t have one, reach
      out on <a href="https://www.linkedin.com/in/arorapuneet11/" target="_blank" rel="noopener" style="color: var(--signal);">LinkedIn</a>
      or via <a href="mailto:puneetindelhi@yahoo.com" style="color: var(--signal);">email</a>.
    </p>

    <form id="gate-form" class="gate__form" autocomplete="off" novalidate>
      <input
        id="gate-input"
        type="password"
        class="gate__input"
        placeholder="passcode"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        required>
      <button type="submit" class="gate__submit">ENTER →</button>
    </form>

    <div class="gate__hint">
      <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--dim);">
        <input type="checkbox" id="gate-remember" style="accent-color: var(--signal);">
        REMEMBER ON THIS DEVICE
      </label>
      <span class="mono">Soft gate · client-side</span>
    </div>
    <div class="gate__err">Incorrect passcode. Try again.</div>
  </div>

  <div class="gate__foot">
    <span>© <span id="year">2026</span> · PUNEET ARORA · BENGALURU</span>
    <span>v.2026.06 · BUILD-001</span>
  </div>
</main>

<script src="assets/site.js"></script>
</body>
</html>
