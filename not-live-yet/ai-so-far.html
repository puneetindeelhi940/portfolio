<style>
  /* ============================================================
     AI, SO FAR — a living GenAI fact card
     Tall glass card · purple/royal-blue aurora · notebook page-flip
     (tap or every 44s) · live news layer. Refreshed weekly.
     Built by Puneet Arora.
     ============================================================ */
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --f-sans:'Roboto',system-ui,-apple-system,sans-serif;
    --f-mono:'Roboto Mono',ui-monospace,monospace;
    --ink:#f3f1fb; --dim:#a9a5c9; --faint:#6f6b93;
    --stage:#070510;
    --purple:#a855f7; --royal:#4f46e5; --indigo:#6366f1; --blue:#3b82f6;
  }
  html,body{height:100%;}
  body{
    font-family:var(--f-sans);color:var(--ink);
    background:radial-gradient(130% 100% at 50% 0%, rgba(124,58,237,.16) 0%, rgba(37,25,74,.35) 34%, var(--stage) 70%);
    min-height:100svh;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }

  /* ---------------- STAGE + AURORA ---------------- */
  .stage{position:fixed;inset:0;overflow:hidden;z-index:0;}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;will-change:transform;}
  .blob--a{width:58vmax;height:58vmax;left:-16vmax;top:-20vmax;background:var(--purple);animation:drift-a 26s ease-in-out infinite;}
  .blob--b{width:50vmax;height:50vmax;right:-14vmax;top:6vmax;background:var(--royal);opacity:.42;animation:drift-b 32s ease-in-out infinite;}
  .blob--c{width:46vmax;height:46vmax;left:24vmax;bottom:-26vmax;background:var(--blue);opacity:.34;animation:drift-c 38s ease-in-out infinite;}
  @keyframes drift-a{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(6vmax,4vmax) scale(1.12);}}
  @keyframes drift-b{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-5vmax,6vmax) scale(1.08);}}
  @keyframes drift-c{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(4vmax,-5vmax) scale(1.15);}}
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.045;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 92% at 50% 44%,transparent 40%,rgba(7,5,16,.55) 82%,rgba(7,5,16,.9) 100%);}

  /* ---------------- SHELL ---------------- */
  .wrap{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;
    max-width:1100px;margin:0 auto;padding:24px clamp(20px,4vw,48px) 20px;}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
  .brand .mk{font-family:var(--f-mono);font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink);font-weight:500;}
  .brand .mk b{background:linear-gradient(90deg,var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .back{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
    text-decoration:none;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 14px;transition:color .2s,border-color .2s;}
  .back:hover{color:var(--ink);border-color:rgba(168,85,247,.6);}

  /* ---------------- CARD ---------------- */
  .stagerow{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 0;}
  .cardshell{position:relative;width:100%;max-width:317px;perspective:1600px;}
  .cardshell::before{content:"";position:absolute;inset:-1.5px;border-radius:22px;z-index:0;
    background:conic-gradient(from 0deg,var(--purple),var(--royal),var(--blue),var(--indigo),var(--purple));
    filter:blur(10px);opacity:.55;animation:spin 14s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .card{position:relative;z-index:1;min-height:327px;display:flex;flex-direction:column;cursor:pointer;
    border:1px solid rgba(168,140,255,.22);border-radius:20px;transform-origin:50% 0%;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform,opacity;
    background:
      radial-gradient(120% 70% at 50% 118%, rgba(59,130,246,.42), transparent 60%),
      linear-gradient(180deg, rgba(72,48,132,.5) 0%, rgba(46,34,104,.62) 52%, rgba(46,42,138,.78) 100%);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    box-shadow:0 30px 90px -44px rgba(76,29,149,.9), inset 0 1px 0 rgba(255,255,255,.1);
    padding:clamp(24px,3.4vw,32px);overflow:hidden;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--purple),var(--blue));}
  .card::after{content:"";position:absolute;right:-28%;top:-38%;width:66%;height:120%;
    background:radial-gradient(closest-side,rgba(168,85,247,.28),transparent);pointer-events:none;}
  .card:hover{border-color:rgba(168,140,255,.42);}

  .kicker{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);margin:0 0 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .kicker .era{background:linear-gradient(90deg,var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:600;}
  .kicker .live{display:inline-flex;align-items:center;gap:6px;color:#fca5f5;font-weight:600;}
  .kicker .live .d{width:6px;height:6px;border-radius:50%;background:#f0abfc;box-shadow:0 0 8px 1px rgba(240,171,252,.9);animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .fact{font-size:clamp(19px,2.2vw,26px);line-height:1.18;letter-spacing:-.02em;font-weight:800;color:var(--ink);text-wrap:balance;}
  .note{margin-top:15px;font-size:clamp(12.5px,1.2vw,14px);line-height:1.55;color:var(--dim);}
  .taphint{margin-top:auto;padding-top:16px;font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:7px;opacity:.72;}
  .taphint .dot{width:5px;height:5px;border-radius:50%;background:var(--purple);box-shadow:0 0 8px 1px rgba(168,85,247,.7);}

  footer.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);}
  .credit{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
  .credit b{color:var(--dim);font-weight:500;}
  .foot .meta{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;color:var(--faint);}

  @media(prefers-reduced-motion:reduce){ .blob,.cardshell::before{animation:none;} }

  /* ---------------- EMBED MODE (?embed=1) — just the card ---------------- */
  html.embed,html.embed body{background:transparent;min-height:0;height:auto;}
  html.embed .stage,html.embed .grain,html.embed .vignette,html.embed header.top,html.embed footer.foot{display:none!important;}
  html.embed .wrap{padding:0;min-height:0;}
  html.embed .stagerow{padding:14px;min-height:100svh;}
  html.embed .cardshell{max-width:100%;}
</style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="blob blob--a"></div>
    <div class="blob blob--b"></div>
    <div class="blob blob--c"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="wrap">
    <header class="top">
      <a class="brand" href="ai-lab.html" title="Back to the AI Lab">
        <span class="mk">AI, <b>SO FAR</b></span>
      </a>
      <a class="back" href="ai-lab.html">&larr; AI Lab</a>
    </header>

    <div class="stagerow">
      <div class="cardshell">
        <article class="card" id="card" role="button" tabindex="0" aria-label="Show the next fact" aria-live="polite">
          <div class="kicker" id="kicker"></div>
          <h1 class="fact" id="fact"></h1>
          <p class="note" id="note"></p>
          <div class="taphint"><span class="dot"></span>Tap to turn the page</div>
        </article>
      </div>
    </div>

    <footer class="foot">
      <span class="credit">Built by <b>Puneet Arora</b></span>
      <span class="meta">Tap the card &middot; live + weekly &middot; <span id="stamp"></span></span>
    </footer>
  </div>

<script>
(function(){
  "use strict";

  /* ============================================================
     DECK — the living database of what AI has done so far.
     Auto-refreshed weekly (new entries added, stale ones pruned).
     Each entry: { era: "<year · where>", fact: "...", note: "..." }
     >>> DECK_START (weekly updater edits between these markers) <<< */
  var DECK = [
    { era:"2022 · DeepMind", fact:"AI mapped the 3-D shape of nearly every protein known to science — about 200 million — and gave the whole database away for free.", note:"AlphaFold compressed a problem biologists had wrestled with for 50 years into an afternoon, accelerating drug and disease research worldwide." },
    { era:"2024 · Stockholm", fact:"The Nobel Prizes honoured AI twice in one year — Chemistry for protein folding, Physics for the foundations of neural networks.", note:"Demis Hassabis and John Jumper shared the Chemistry prize; Geoffrey Hinton and John Hopfield the Physics prize — a field's coming-of-age." },
    { era:"2016 · Seoul", fact:"A machine beat one of the greatest Go players alive, 4 games to 1 — a feat experts had said was a decade away.", note:"AlphaGo's 'move 37' was so alien and so good that it changed how human champions play the game." },
    { era:"2023 · everywhere", fact:"A chatbot reached an estimated 100 million users in about two months — the fastest a consumer product had ever spread.", note:"ChatGPT put generative AI in ordinary hands overnight and reset expectations for what software can do." },
    { era:"ongoing · clinics", fact:"AI screening now flags diabetic eye disease and certain cancers earlier — lending expert-level eyes to places that have none.", note:"When calibrated and supervised, these tools extend scarce specialists to millions who would otherwise go unseen." },
    { era:"2023 · forecasting", fact:"AI weather models produce 10-day global forecasts in under a minute — often more accurately than the physics-based giants.", note:"GraphCast and its rivals run on a single machine, hinting at cheaper, faster early warnings for extreme weather." },
    { era:"ongoing · roads", fact:"Fully driverless robotaxis now carry paying passengers through several cities, day and night.", note:"After decades of hype, autonomy is finally a service you can hail — cautiously, and city by city." },
    { era:"ongoing · language", fact:"Real-time speech translation across 100+ languages is quietly dissolving barriers that stood for millennia.", note:"From clinics to classrooms, people who could never understand one another now can — instantly." },
    { era:"2012 · the spark", fact:"A neural network crushed an image-recognition contest so decisively that it lit the fuse on the entire modern AI era.", note:"'AlexNet' proved deep learning worked at scale, and the industry pivoted almost overnight." },
    { era:"ongoing · trust", fact:"Large language models 'hallucinate' — inventing citations, quotes and facts with complete, fluent confidence.", note:"The same fluency that makes them useful makes their mistakes dangerously easy to believe." },
    { era:"2023 · New York", fact:"Lawyers were sanctioned after filing a legal brief full of court cases that a chatbot had simply made up.", note:"A cautionary tale that went global: convincing text is not the same as true text." },
    { era:"2018 · the mirror", fact:"'Gender Shades' showed commercial face-recognition failed far more often on darker-skinned and female faces.", note:"AI inherits the blind spots of its data — and then applies them at scale, to real people." },
    { era:"ongoing · the grid", fact:"Training and running frontier models burns enormous electricity and water — data-centre demand is straining power grids.", note:"The intelligence is cheap to use and expensive to run; the environmental bill is only now coming due." },
    { era:"2023– · the courts", fact:"Artists, authors and newsrooms are suing over copyrighted work swept into training data without consent.", note:"Who owns what a model learned from — and who gets paid — is being decided in court, right now." },
    { era:"ongoing · the web", fact:"AI-generated text and images are flooding the internet, making it harder to tell what — and who — is real.", note:"As synthetic content trains the next models, the signal of the open web risks drowning in its own noise." },
    { era:"2024 · New Hampshire", fact:"A faked robocall cloning a president's voice tried to talk voters out of showing up to a primary.", note:"Cheap, convincing voice clones turned election interference into a point-and-click affair." },
    { era:"ongoing · your phone", fact:"Voice-cloning scams now imitate a loved one in distress to extort money from their own family.", note:"A few seconds of audio is enough to weaponise a familiar voice against the people who trust it." },
    { era:"ongoing · consent", fact:"Deepfake tools are used to fabricate non-consensual explicit images — overwhelmingly of women and girls.", note:"The technology to violate someone's likeness is now free, fast, and far too easy to find." },
    { era:"ongoing · justice", fact:"Wrongful face-recognition matches have led to innocent people being arrested for crimes they did not commit.", note:"When a flawed match is treated as fact, the burden of the machine's error falls on the wrongly accused." },
    { era:"ongoing · warfare", fact:"Nations are racing to field autonomous weapons that can select and strike targets with little human say.", note:"The debate over handing life-and-death decisions to software is no longer hypothetical." }
  ];
  /* >>> DECK_END <<< */
  var LAST_REFRESH = "2026-08-09"; /* >>> updated weekly <<< */

  var card   = document.getElementById("card");
  var kicker = document.getElementById("kicker");
  var factEl = document.getElementById("fact");
  var noteEl = document.getElementById("note");
  document.getElementById("stamp").textContent = "updated " + LAST_REFRESH;

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var i = Math.floor(Math.random() * DECK.length);
  var timer = null, busy = false, DUR = 44000;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function paint(){
    var d = DECK[i];
    kicker.innerHTML = d.live
      ? '<span class="live"><span class="d"></span>Live</span> · <span class="era">' + esc(d.src || "News") + "</span>"
      : '<span class="era">' + esc(d.era) + "</span>";
    factEl.textContent = d.fact;
    noteEl.textContent = d.note;
  }

  /* --- notebook page-flip via Web Animations API (robust, never sticks) --- */
  function flip(dir){
    if(busy) return;
    var advance = function(){ i = (i + dir + DECK.length) % DECK.length; paint(); };
    if(reduce || !card.animate){ advance(); schedule(); return; }
    busy = true;
    var out = card.animate(
      [{transform:"rotateX(0deg)",opacity:1},{transform:"rotateX(88deg)",opacity:.06}],
      {duration:620, easing:"cubic-bezier(.45,0,.85,.3)"}
    );
    out.onfinish = function(){
      advance();
      var inn = card.animate(
        [{transform:"rotateX(-88deg)",opacity:.06},{transform:"rotateX(0deg)",opacity:1}],
        {duration:780, easing:"cubic-bezier(.18,.75,.25,1)"}
      );
      inn.onfinish = function(){ busy = false; };
    };
  }
  function schedule(){ clearTimeout(timer); timer = setTimeout(function(){ flip(1); }, DUR); }

  /* tap / click / keyboard turns the page */
  card.addEventListener("click", function(){ flip(1); });
  card.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); flip(1); }
  });
  document.addEventListener("keydown", function(e){
    if(e.target === card) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); flip(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); flip(-1); }
  });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ clearTimeout(timer); } else { schedule(); }
  });

  /* ---------------- LIVE NEWS LAYER (Hacker News, keyless + CORS) ---------------- */
  function rel(ts){
    var s = Math.floor(Date.now()/1000) - ts, d = Math.floor(s/86400), h = Math.floor(s/3600);
    return d >= 1 ? d + "d ago" : (h >= 1 ? h + "h ago" : "just now");
  }
  function hnURL(days){
    var q = "query=artificial%20intelligence&tags=story&hitsPerPage=50";
    if(days){ q += "&numericFilters=created_at_i%3E" + (Math.floor(Date.now()/1000) - days*86400); }
    return "https://hn.algolia.com/api/v1/search?" + q; // relevance/popularity ranked
  }
  function toLive(hits){
    return (hits || []).filter(function(h){ return h.url && h.title && h.title.length <= 130; })
      .sort(function(a,b){ return (b.points||0) - (a.points||0); })
      .slice(0, 4)
      .map(function(h){
        return { live:true, src:"Hacker News", era:"live",
                 fact:h.title, note:(h.points||0) + " points on Hacker News · " + rel(h.created_at_i) };
      });
  }
  function grab(url){
    var ctrl = new AbortController(); var to = setTimeout(function(){ ctrl.abort(); }, 6000);
    return fetch(url, { signal: ctrl.signal }).then(function(r){ clearTimeout(to); return r.json(); });
  }
  function loadLive(){
    grab(hnURL(45)).then(function(data){
      var live = toLive(data && data.hits);
      if(live.length >= 2) return live;
      return grab(hnURL(0)).then(function(d2){ return toLive(d2 && d2.hits); });
    }).then(function(live){
      if(live && live.length){ DECK = live.concat(DECK); }
    }).catch(function(){ /* offline / blocked — curated deck still works */ });
  }

  /* ---------------- GO ---------------- */
  paint();
  if(!reduce && card.animate){ card.animate([{transform:"rotateX(-72deg)",opacity:0},{transform:"rotateX(0)",opacity:1}],{duration:820,easing:"cubic-bezier(.18,.75,.25,1)"}); }
  schedule();
  loadLive();
})();
</script>
</body>
