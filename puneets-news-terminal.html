<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --bg-2: #141414;
  --surface: #1a1a1a;
  --surface-2: #222222;
  --surface-3: #2a2a2a;
  --ink: #e8e8e8;
  --ink-2: #bbbbbb;
  --dim: #888888;
  --faint: #555555;
  --rule: #2a2a2a;
  --accent: #999999;
  --accent-dim: rgba(153, 153, 153, 0.12);
  --brief-bg: #141414;
  --brief-border: #2a2a2a;
  --danger: #cc4444;
  --radius: 8px;
  --radius-sm: 6px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --max-w: 1400px;
  --pad: 24px;
  --topbar-h: 56px;
}

/* ═══════════ PLAYFUL MODE ═══════════ */
[data-mode="playful"] {
  --bg: #0d2b28;
  --bg-2: #123a36;
  --surface: rgba(255, 255, 255, 0.05);
  --surface-2: rgba(255, 255, 255, 0.09);
  --surface-3: rgba(255, 255, 255, 0.13);
  --ink: #f5f1e6;
  --ink-2: #cfe8df;
  --dim: #9bc4b9;
  --faint: #7fa89f;
  --rule: rgba(255, 255, 255, 0.14);
  --accent: #f2c14e;
  --accent-dim: rgba(242, 193, 78, 0.18);
  --brief-bg: rgba(255, 255, 255, 0.06);
  --brief-border: rgba(255, 255, 255, 0.16);
  --danger: #ff6b6b;
  background: transparent;
}

[data-mode="playful"] .nt-topbar {
  background: rgba(13, 43, 40, 0.78);
}

[data-mode="playful"] .nt-chips-wrap {
  background: rgba(13, 43, 40, 0.72);
}

[data-mode="playful"] .nt-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #14241f;
}

[data-mode="playful"] .nt-card:hover {
  border-color: var(--accent);
  box-shadow: 0 6px 24px rgba(242, 193, 78, 0.2);
}

[data-mode="playful"] .nt-brief__card,
[data-mode="playful"] .nt-headline,
[data-mode="playful"] .nt-card,
[data-mode="playful"] .nt-skeleton {
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

[data-mode="playful"] .nt-search__input {
  background: rgba(255, 255, 255, 0.08);
  border-color: var(--rule);
  color: var(--ink);
}

[data-mode="playful"] .nt-search__input::placeholder {
  color: var(--faint);
}

/* ═══════════ PLAYFUL ANIMATED BOKEH BACKGROUND ═══════════ */
.nt-bokeh {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  background: var(--bg);
  opacity: 0;
  transition: opacity 0.6s ease, background 0.3s ease;
}

[data-mode="playful"] .nt-bokeh { opacity: 1; }

.nt-bokeh__circle {
  position: absolute;
  border-radius: 50%;
  filter: blur(40px);
  opacity: 0.55;
  animation: bokeh-float 22s ease-in-out infinite alternate;
}

.nt-bokeh__circle--1 { width: 380px; height: 380px; left: 2%; top: 6%; background: radial-gradient(circle, #2e8b7a, transparent 70%); animation-duration: 24s; }
.nt-bokeh__circle--2 { width: 240px; height: 240px; left: 28%; top: 55%; background: radial-gradient(circle, #f2c14e, transparent 70%); animation-duration: 28s; animation-delay: -4s; }
.nt-bokeh__circle--3 { width: 300px; height: 300px; left: 55%; top: 15%; background: radial-gradient(circle, #3fae71, transparent 70%); animation-duration: 26s; animation-delay: -9s; }
.nt-bokeh__circle--4 { width: 200px; height: 200px; left: 78%; top: 60%; background: radial-gradient(circle, #e8a33d, transparent 70%); animation-duration: 20s; animation-delay: -2s; }
.nt-bokeh__circle--5 { width: 260px; height: 260px; left: 12%; top: 75%; background: radial-gradient(circle, #1f5650, transparent 70%); animation-duration: 30s; animation-delay: -12s; }
.nt-bokeh__circle--6 { width: 180px; height: 180px; left: 65%; top: 85%; background: radial-gradient(circle, #f2c14e, transparent 70%); animation-duration: 23s; animation-delay: -7s; }
.nt-bokeh__circle--7 { width: 320px; height: 320px; left: 88%; top: 5%; background: radial-gradient(circle, #2e8b7a, transparent 70%); animation-duration: 27s; animation-delay: -15s; }

@keyframes bokeh-float {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(40px, -30px) scale(1.15); }
  100% { transform: translate(-30px, 25px) scale(0.95); }
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.3s ease, color 0.3s ease;
}

a { color: inherit; text-decoration: none; }

/* ═══════════ TOPBAR ═══════════ */
.nt-topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 10, 10, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--rule);
  padding: 0 var(--pad);
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 16px;
  transition: background 0.3s ease;
}

.nt-back {
  font-size: 12px;
  color: var(--dim);
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  transition: color 0.2s;
}

.nt-back:hover { color: var(--accent); }

.nt-brand {
  font-size: 13px;
  font-weight: 600;
  color: var(--dim);
  white-space: nowrap;
  letter-spacing: 0.02em;
  flex-shrink: 0;
}

.nt-brand strong {
  color: var(--ink);
  font-weight: 700;
}

.nt-topbar__spacer { flex: 1; }

.nt-search {
  position: relative;
  flex: 0 1 360px;
  min-width: 200px;
}

.nt-search__icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--faint);
  pointer-events: none;
  width: 16px;
  height: 16px;
}

.nt-search__input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font-family: var(--font);
  font-size: 13px;
  padding: 8px 12px 8px 36px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
}

.nt-search__input::placeholder { color: var(--dim); }
.nt-search__input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

.nt-topbar__spacer-2 { flex: 1; }

.nt-mode-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.nt-mode-toggle__label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
  cursor: pointer;
  transition: color 0.2s;
  padding: 4px 8px;
  border-radius: 4px;
}

.nt-mode-toggle__label:hover { color: var(--ink); }

.nt-mode-toggle__label.active {
  color: var(--ink);
  background: var(--surface-2);
}

.nt-refreshed {
  font-size: 11px;
  color: var(--ink-2);
  white-space: nowrap;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}

.nt-refreshed__dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4caf50;
  box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.25), 0 0 8px rgba(76, 175, 80, 0.9);
  margin-right: 8px;
  animation: pulse-dot 1.4s ease infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}

/* ═══════════ CHIP ROW ═══════════ */
.nt-chips-wrap {
  position: sticky;
  top: var(--topbar-h);
  z-index: 90;
  background: rgba(10, 10, 10, 0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
  transition: background 0.3s ease;
}

.nt-chips {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px var(--pad);
  max-width: var(--max-w);
  margin: 0 auto;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.nt-chips::-webkit-scrollbar { display: none; }

.nt-chip {
  appearance: none;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 20px;
  color: var(--ink-2);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 16px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.nt-chip:hover {
  background: var(--surface-2);
  border-color: var(--accent);
  color: var(--ink);
}

.nt-chip.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
  font-weight: 600;
}

/* ═══════════ TOP ROW: HEADLINE + LATEST BRIEF ═══════════ */
.nt-top-row {
  max-width: var(--max-w);
  margin: var(--pad) auto 0;
  padding: 0 var(--pad);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: stretch;
}

.nt-headline {
  background: var(--brief-bg);
  border: 1px solid var(--brief-border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background 0.3s, border-color 0.3s;
}

.nt-headline__img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  background: var(--surface-2);
}

.nt-headline__body {
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.nt-headline__tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}

.nt-headline__title {
  font-size: 19px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--ink);
  display: block;
}

.nt-headline__desc {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.5;
}

.nt-headline__time {
  font-size: 11px;
  color: var(--dim);
  margin-top: auto;
}

.nt-brief { height: 100%; }

.nt-brief__card {
  background: var(--brief-bg);
  border: 1px solid var(--brief-border);
  border-radius: var(--radius);
  padding: 24px 28px;
  height: 100%;
  transition: background 0.3s, border-color 0.3s;
}

.nt-brief__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.nt-brief__title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
}

.nt-brief__badge {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dim);
  padding: 3px 10px;
  border: 1px solid var(--rule);
  border-radius: 20px;
}

.nt-brief__list {
  list-style: none;
  counter-reset: brief;
}

.nt-brief__item {
  counter-increment: brief;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule);
  transition: background 0.15s;
  color: inherit;
  text-decoration: none;
}

.nt-brief__item:last-child { border-bottom: none; }

.nt-brief__item:hover {
  background: var(--accent-dim);
  margin: 0 -8px;
  padding-left: 8px;
  padding-right: 8px;
  border-radius: 4px;
}

.nt-brief__num {
  font-size: 12px;
  font-weight: 700;
  color: var(--faint);
  min-width: 20px;
  padding-top: 2px;
}

.nt-brief__num::before {
  content: counter(brief, decimal-leading-zero);
}

.nt-brief__text {
  flex: 1;
}

.nt-brief__headline {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.4;
  margin-bottom: 2px;
}

.nt-brief__source {
  font-size: 11px;
  color: var(--dim);
}

.nt-brief__skeleton {
  height: 14px;
  background: linear-gradient(110deg, var(--surface-2) 8%, var(--surface-3) 18%, var(--surface-2) 33%);
  background-size: 200% 100%;
  animation: shimmer 1.5s linear infinite;
  border-radius: 4px;
  margin-bottom: 16px;
}

.nt-brief__skeleton--short { width: 60%; }
.nt-brief__skeleton--long { width: 90%; }

/* ═══════════ MAIN GRID ═══════════ */
.nt-main {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 20px var(--pad) var(--pad);
}

.nt-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 36px 24px;
}

/* ═══════════ NEWS CARD (20% smaller) ═══════════ */
.nt-card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.3s;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

.nt-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
}

.nt-card__img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  background: var(--surface-2);
}

.nt-card__body {
  padding: 12px 14px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.nt-card__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.nt-card__source {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
}

.nt-card__time {
  font-size: 10px;
  color: var(--faint);
}

.nt-card__title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--ink);
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.nt-card__desc {
  font-size: 11px;
  color: var(--dim);
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 8px;
}

.nt-card__category {
  margin-top: auto;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
  padding: 3px 8px;
  background: var(--surface-2);
  border-radius: 20px;
  align-self: flex-start;
}

/* ═══════════ SKELETON LOADER ═══════════ */
.nt-skeleton {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
}

.nt-skeleton__img {
  width: 100%;
  height: 140px;
  background: linear-gradient(110deg, var(--surface-2) 8%, var(--surface-3) 18%, var(--surface-2) 33%);
  background-size: 200% 100%;
  animation: shimmer 1.5s linear infinite;
}

.nt-skeleton__body { padding: 12px 14px; }

.nt-skeleton__line {
  height: 10px;
  background: linear-gradient(110deg, var(--surface-2) 8%, var(--surface-3) 18%, var(--surface-2) 33%);
  background-size: 200% 100%;
  animation: shimmer 1.5s linear infinite;
  border-radius: 3px;
  margin-bottom: 8px;
}

.nt-skeleton__line--short { width: 40%; }
.nt-skeleton__line--title { height: 13px; width: 90%; }
.nt-skeleton__line--med { width: 70%; }

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ═══════════ EMPTY STATE ═══════════ */
.nt-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 24px;
  color: var(--dim);
}

.nt-empty__icon {
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.4;
}

.nt-empty__title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-2);
  margin-bottom: 6px;
}

.nt-empty__desc {
  font-size: 13px;
  color: var(--faint);
  max-width: 400px;
  margin: 0 auto;
}

/* ═══════════ ERROR BANNER ═══════════ */
.nt-error {
  max-width: var(--max-w);
  margin: 12px auto;
  padding: 10px var(--pad);
  background: rgba(204, 68, 68, 0.1);
  border: 1px solid rgba(204, 68, 68, 0.3);
  border-radius: var(--radius-sm);
  color: var(--danger);
  font-size: 12px;
  display: none;
  align-items: center;
  gap: 8px;
}

.nt-error.visible { display: flex; }

/* ═══════════ FOOTER ═══════════ */
.nt-footer {
  text-align: center;
  padding: 88px var(--pad) 70px;
  color: var(--ink-2);
  font-size: 11px;
  border-top: 1px solid var(--rule);
  margin-top: 32px;
}

.nt-footer__copy {
  margin-bottom: 32px;
}

.nt-ticker {
  max-width: var(--max-w);
  margin: 0 auto;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
}

.nt-ticker__label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
  margin-bottom: 14px;
}

.nt-ticker__track {
  display: flex;
  width: max-content;
  animation: ticker-scroll 50s linear infinite;
}

.nt-ticker__item {
  flex: 0 0 calc(var(--max-w) / 6);
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--ink-2);
  white-space: nowrap;
}

@keyframes ticker-scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* ═══════════ RESPONSIVE ═══════════ */
@media (max-width: 768px) {
  :root { --pad: 16px; }

  .nt-topbar {
    flex-wrap: wrap;
    height: auto;
    padding: 10px var(--pad);
    gap: 8px;
  }

  .nt-search { flex: 1 1 100%; order: 10; min-width: 0; }
  .nt-topbar__spacer, .nt-topbar__spacer-2 { display: none; }

  .nt-brand { font-size: 11px; }

  .nt-grid {
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px 14px;
  }

  .nt-card__img { height: 120px; }

  .nt-top-row { grid-template-columns: 1fr; }

  .nt-ticker__item { flex-basis: 50vw; }
}

@media (max-width: 480px) {
  .nt-mode-toggle__label { display: none; }
  .nt-refreshed span { display: none; }
  .nt-grid { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body data-mode="serious">

<div class="nt-bokeh" aria-hidden="true">
  <span class="nt-bokeh__circle nt-bokeh__circle--1"></span>
  <span class="nt-bokeh__circle nt-bokeh__circle--2"></span>
  <span class="nt-bokeh__circle nt-bokeh__circle--3"></span>
  <span class="nt-bokeh__circle nt-bokeh__circle--4"></span>
  <span class="nt-bokeh__circle nt-bokeh__circle--5"></span>
  <span class="nt-bokeh__circle nt-bokeh__circle--6"></span>
  <span class="nt-bokeh__circle nt-bokeh__circle--7"></span>
</div>

<!-- ═══════════ TOPBAR ═══════════ -->
<header class="nt-topbar">
  <a href="Altermayur.html" class="nt-back" title="Back to portfolio">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Portfolio
  </a>
  <div class="nt-brand"><strong>AI News Terminal</strong> &mdash; built by Puneet</div>

  <div class="nt-topbar__spacer"></div>

  <div class="nt-search">
    <svg class="nt-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="nt-search__input" type="search" placeholder="Search headlines..." id="newsSearch" autocomplete="off">
  </div>

  <div class="nt-topbar__spacer-2"></div>

  <div class="nt-mode-toggle">
    <span class="nt-mode-toggle__label active" data-mode-label="serious" id="btnSerious">Serious</span>
    <span class="nt-mode-toggle__label" data-mode-label="playful" id="btnPlayful">Playful</span>
  </div>

  <div class="nt-refreshed" id="lastRefreshed">
    <span class="nt-refreshed__dot"></span>
    <span>Last refreshed: --</span>
  </div>
</header>

<!-- ═══════════ CHIP FILTERS ═══════════ -->
<div class="nt-chips-wrap">
  <div class="nt-chips" id="chipRow">
    <button class="nt-chip active" data-cat="popular">Popular</button>
    <button class="nt-chip" data-cat="business">Business</button>
    <button class="nt-chip" data-cat="technology">Technology</button>
    <button class="nt-chip" data-cat="ux">UX</button>
    <button class="nt-chip" data-cat="women">Women</button>
    <button class="nt-chip" data-cat="weather">Weather</button>
    <button class="nt-chip" data-cat="gadgets">Gadgets</button>
    <button class="nt-chip" data-cat="regional">Regional</button>
    <button class="nt-chip" data-cat="culture">Culture</button>
    <button class="nt-chip" data-cat="startups">Startups</button>
    <button class="nt-chip" data-cat="travel">Travel</button>
    <button class="nt-chip" data-cat="sports">Sports</button>
  </div>
</div>

<!-- ═══════════ ERROR BANNER ═══════════ -->
<div class="nt-error" id="errorBanner">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <span id="errorMsg"></span>
</div>

<!-- ═══════════ TOP ROW: HEADLINE + LATEST BRIEF ═══════════ -->
<div class="nt-top-row">
  <div class="nt-headline" id="headlineCard">
    <div class="nt-skeleton__img"></div>
    <div class="nt-headline__body">
      <div class="nt-brief__skeleton nt-brief__skeleton--short"></div>
      <div class="nt-brief__skeleton nt-brief__skeleton--long"></div>
    </div>
  </div>

  <div class="nt-brief">
    <div class="nt-brief__card" id="briefCard">
      <div class="nt-brief__header">
        <span class="nt-brief__title">Latest Brief</span>
        <span class="nt-brief__badge" id="briefBadge">Top 10 Trending</span>
      </div>
      <ol class="nt-brief__list" id="briefList">
        <!-- Injected by JS -->
      </ol>
    </div>
  </div>
</div>

<!-- ═══════════ MAIN CONTENT ═══════════ -->
<main class="nt-main">
  <div class="nt-grid" id="newsGrid">
    <!-- Cards or skeletons injected by JS -->
  </div>
</main>

<footer class="nt-footer">
  <div class="nt-footer__copy">&copy; 2026 Puneet Arora. News sourced from 60+ outlets worldwide.</div>
  <div class="nt-ticker">
    <div class="nt-ticker__label">News Sources:</div>
    <div class="nt-ticker__track" id="tickerTrack">
      <!-- Injected by JS -->
    </div>
  </div>
</footer>

<script>
(function () {
  'use strict';

  var CATEGORIES = {
    popular:    { label: 'Popular',    sources: ['BBC News','Reuters','Associated Press','The Guardian','CNN','The Hindu','Indian Express','Times of India','Hindustan Times','NDTV'] },
    business:   { label: 'Business',   sources: ['Bloomberg','CNBC','Financial Times','The Economic Times','Mint','Moneycontrol','Business Standard','Yahoo Finance','MarketWatch'] },
    technology: { label: 'Technology', sources: ['TechCrunch','The Verge','Wired','Ars Technica','MIT Technology Review','MacRumors'] },
    ux:         { label: 'UX',         sources: ['Nielsen Norman Group','UX Collective','Smashing Magazine','A List Apart','UX Magazine'] },
    women:      { label: 'Women',      sources: ['Women Love Tech','SheThePeople','Fortune'] },
    weather:    { label: 'Weather',    sources: ['Weather.com','AccuWeather'] },
    gadgets:    { label: 'Gadgets',    sources: ['GSMArena','Android Authority','Gadget 360','Gadgets Now'] },
    regional:   { label: 'Regional',   sources: ['Google News','Microsoft Start','NDTV','The Hindu','Indian Express','Times of India'] },
    culture:    { label: 'Culture',    sources: ['National Geographic','Smithsonian Magazine','Scroll Culture','The Better India'] },
    startups:   { label: 'Startups',   sources: ['ET Tech','NASSCOM News','People Matters','YourStory'] },
    travel:     { label: 'Travel',     sources: ['Condé Nast Traveler','Lonely Planet','National Geographic Travel'] },
    sports:     { label: 'Sports',     sources: ['ESPN','Cricbuzz','ESPN Cricinfo','Olympics.com'] }
  };

  var RSS_FEEDS = {
    popular: [
      'http://feeds.bbci.co.uk/news/rss.xml',
      'https://rss.nytimes.com/services/xml/rss/nyt/World.xml',
      'https://www.theguardian.com/world/rss',
      'https://thehindu.com/news/national/feeder/default.rss',
      'https://indianexpress.com/feed/',
      'https://www.ndtv.com/rss/top-stories'
    ],
    business: [
      'https://www.cnbc.com/id/100003114/device/rss/rss.html',
      'https://economictimes.indiatimes.com/rssfeedstopstories.cms',
      'https://www.livemint.com/rss/markets',
      'https://www.moneycontrol.com/rss/latestnews.xml',
      'https://www.business-standard.com/rss/home_page_top_stories.rss'
    ],
    technology: [
      'https://techcrunch.com/feed/',
      'https://www.theverge.com/rss/index.xml',
      'https://www.wired.com/feed/rss',
      'https://feeds.arstechnica.com/arstechnica/index',
      'https://feeds.feedburner.com/macrumors/MacRumors'
    ],
    ux: [
      'https://feeds.feedburner.com/SmashingMagazine',
      'https://alistapart.com/main/feed/',
      'https://uxmag.com/feed'
    ],
    women: [
      'https://www.womenlovetech.com/feed/',
      'https://www.shethepeople.tv/feed/'
    ],
    weather: [
      'https://weather.com/feeds/enhancedconditions/rss'
    ],
    gadgets: [
      'https://www.gsmarena.com/rss-news-reviews.php3',
      'https://www.androidauthority.com/feed/',
      'https://feeds.feedburner.com/gadgets360-latest'
    ],
    regional: [
      'https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en',
      'https://www.ndtv.com/rss/top-stories',
      'https://thehindu.com/news/national/feeder/default.rss'
    ],
    culture: [
      'https://www.smithsonianmag.com/rss/latest_articles/',
      'https://www.thebetterindia.com/feed/'
    ],
    startups: [
      'https://yourstory.com/feed',
      'https://economictimes.indiatimes.com/tech/startups/rssfeeds/70983202.cms'
    ],
    travel: [
      'https://www.lonelyplanet.com/feed.xml',
      'https://www.cntraveler.com/feed/rss'
    ],
    sports: [
      'https://www.espncricinfo.com/rss/content/story/feeds/0.xml',
      'https://www.espn.com/espn/rss/news'
    ]
  };

  var activeCat = 'popular';
  var newsCache = {};
  var searchQuery = '';
  var userRegion = 'IN';

  var grid       = document.getElementById('newsGrid');
  var briefList  = document.getElementById('briefList');
  var briefBadge = document.getElementById('briefBadge');
  var searchBox  = document.getElementById('newsSearch');
  var chipRow    = document.getElementById('chipRow');
  var btnSerious = document.getElementById('btnSerious');
  var btnPlayful = document.getElementById('btnPlayful');
  var refreshEl  = document.getElementById('lastRefreshed');
  var errorBanner = document.getElementById('errorBanner');
  var errorMsg    = document.getElementById('errorMsg');
  var headlineCard = document.getElementById('headlineCard');
  var tickerTrack   = document.getElementById('tickerTrack');

  var ALL_SOURCES = (function () {
    var seen = {}; var list = [];
    Object.keys(CATEGORIES).forEach(function (cat) {
      CATEGORIES[cat].sources.forEach(function (s) {
        if (!seen[s]) { seen[s] = true; list.push(s); }
      });
    });
    return list.slice(0, 40);
  })();

  function renderTicker() {
    var html = ALL_SOURCES.map(function (s) {
      return '<span class="nt-ticker__item">' + escapeHtml(s) + '</span>';
    }).join('');
    tickerTrack.innerHTML = html + html;
  }
  renderTicker();

  // ── Mode toggle (click labels directly) ──
  var savedMode = localStorage.getItem('nt-mode') || 'serious';
  setMode(savedMode);

  btnSerious.addEventListener('click', function () { setMode('serious'); });
  btnPlayful.addEventListener('click', function () { setMode('playful'); });

  function setMode(mode) {
    document.body.dataset.mode = mode;
    localStorage.setItem('nt-mode', mode);
    btnSerious.classList.toggle('active', mode === 'serious');
    btnPlayful.classList.toggle('active', mode === 'playful');
  }

  // ── Chips ──
  chipRow.addEventListener('click', function (e) {
    var chip = e.target.closest('.nt-chip');
    if (!chip) return;
    chipRow.querySelectorAll('.nt-chip').forEach(function (c) { c.classList.remove('active'); });
    chip.classList.add('active');
    activeCat = chip.dataset.cat;
    renderAll();
  });

  // ── Search (debounced) ──
  var searchTimer;
  searchBox.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      searchQuery = searchBox.value.trim().toLowerCase();
      renderAll();
    }, 250);
  });

  // ── IP-based geolocation ──
  function detectRegion() {
    fetch('https://ipapi.co/json/')
      .then(function (r) { return r.json(); })
      .then(function (data) { if (data && data.country_code) userRegion = data.country_code; })
      .catch(function () { userRegion = 'IN'; });
  }

  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function timeAgo(dateStr) {
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    var diff = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  // ── Brief rendering (top 10) ──
  function renderBrief(items) {
    var top10 = items.slice(0, 10);
    briefBadge.textContent = 'Top ' + Math.min(top10.length, 10) + ' Trending';

    if (top10.length === 0) {
      briefList.innerHTML = '';
      for (var i = 0; i < 5; i++) {
        briefList.innerHTML += '<li style="padding:10px 0;border-bottom:1px solid var(--rule)"><div class="nt-brief__skeleton nt-brief__skeleton--long"></div><div class="nt-brief__skeleton nt-brief__skeleton--short"></div></li>';
      }
      return;
    }

    briefList.innerHTML = top10.map(function (item) {
      return '<a class="nt-brief__item" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">' +
        '<span class="nt-brief__num"></span>' +
        '<div class="nt-brief__text">' +
        '<div class="nt-brief__headline">' + escapeHtml(item.title) + '</div>' +
        '<span class="nt-brief__source">' + escapeHtml(item.source) + ' &middot; ' + timeAgo(item.pubDate) + '</span>' +
        '</div></a>';
    }).join('');
  }

  // ── Card grid rendering ──
  function renderCards(items) {
    if (items.length === 0 && newsCache[activeCat]) {
      grid.innerHTML = '<div class="nt-empty">' +
        '<div class="nt-empty__icon">&#128240;</div>' +
        '<div class="nt-empty__title">' + (searchQuery ? 'No matches for "' + escapeHtml(searchQuery) + '"' : 'No headlines yet') + '</div>' +
        '<div class="nt-empty__desc">' + (searchQuery ? 'Try a different search term.' : 'Check back soon — fresh news is on its way for ' + CATEGORIES[activeCat].label + '.') + '</div>' +
        '</div>';
      return;
    }

    if (items.length === 0) {
      renderSkeletons(8);
      return;
    }

    var remaining = items.slice(10);
    if (remaining.length === 0 && items.length <= 10) remaining = items;

    grid.innerHTML = remaining.map(function (item) {
      var imgHtml = item.image
        ? '<img class="nt-card__img" src="' + escapeHtml(item.image) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
        : '';
      return '<a class="nt-card" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">' +
        imgHtml +
        '<div class="nt-card__body">' +
        '<div class="nt-card__meta">' +
        '<span class="nt-card__source">' + escapeHtml(item.source) + '</span>' +
        '<span class="nt-card__time">' + timeAgo(item.pubDate) + '</span>' +
        '</div>' +
        '<div class="nt-card__title">' + escapeHtml(item.title) + '</div>' +
        (item.description ? '<div class="nt-card__desc">' + escapeHtml(item.description) + '</div>' : '') +
        '<span class="nt-card__category">' + escapeHtml(CATEGORIES[activeCat].label) + '</span>' +
        '</div></a>';
    }).join('');
  }

  function renderAll() {
    var items = newsCache[activeCat] || [];
    if (searchQuery) {
      items = items.filter(function (item) {
        return item.title.toLowerCase().indexOf(searchQuery) !== -1 ||
               (item.description || '').toLowerCase().indexOf(searchQuery) !== -1;
      });
    }
    renderBrief(items);
    renderCards(items);
  }

  function renderSkeletons(count) {
    var html = '';
    for (var i = 0; i < count; i++) {
      html += '<div class="nt-skeleton">' +
        '<div class="nt-skeleton__img"></div>' +
        '<div class="nt-skeleton__body">' +
        '<div class="nt-skeleton__line nt-skeleton__line--short"></div>' +
        '<div class="nt-skeleton__line nt-skeleton__line--title"></div>' +
        '<div class="nt-skeleton__line nt-skeleton__line--med"></div>' +
        '</div></div>';
    }
    grid.innerHTML = html;
  }

  function showError(msg) { errorMsg.textContent = msg; errorBanner.classList.add('visible'); }
  function hideError() { errorBanner.classList.remove('visible'); }

  function updateRefreshTime() {
    var now = new Date();
    var timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    refreshEl.innerHTML = '<span class="nt-refreshed__dot"></span><span>Last refreshed: ' + timeStr + '</span>';
  }

  var RSS2JSON_BASE = 'https://api.rss2json.com/v1/api.json?rss_url=';
  var TOI_FEED = 'https://timesofindia.indiatimes.com/rssfeedstopstories.cms';

  function renderHeadline(item) {
    var img = item.enclosure && item.enclosure.link ? item.enclosure.link : (item.thumbnail || '');
    var desc = (item.description || '').replace(/<[^>]*>/g, '').substring(0, 180);
    headlineCard.innerHTML =
      (img ? '<img class="nt-headline__img" src="' + escapeHtml(img) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
      '<div class="nt-headline__body">' +
      '<span class="nt-headline__tag">Top Story &middot; Times of India</span>' +
      '<a class="nt-headline__title" href="' + escapeHtml(item.link || '') + '" target="_blank" rel="noopener">' + escapeHtml(item.title || '') + '</a>' +
      (desc ? '<p class="nt-headline__desc">' + escapeHtml(desc) + '</p>' : '') +
      '<span class="nt-headline__time">' + timeAgo(item.pubDate) + '</span>' +
      '</div>';
  }

  function fetchHeadline() {
    return fetch(RSS2JSON_BASE + encodeURIComponent(TOI_FEED))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.status === 'ok' && data.items && data.items.length) {
          renderHeadline(data.items[0]);
        }
      })
      .catch(function () {});
  }

  function fetchCategoryNews(cat) {
    var feeds = RSS_FEEDS[cat] || [];
    if (feeds.length === 0) { newsCache[cat] = []; return Promise.resolve(); }

    var promises = feeds.map(function (feedUrl) {
      return fetch(RSS2JSON_BASE + encodeURIComponent(feedUrl))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.status !== 'ok' || !data.items) return [];
          return data.items.map(function (item) {
            return {
              title: item.title || '',
              description: (item.description || '').replace(/<[^>]*>/g, '').substring(0, 200),
              url: item.link || '',
              image: item.enclosure && item.enclosure.link ? item.enclosure.link : (item.thumbnail || ''),
              source: data.feed && data.feed.title ? data.feed.title : 'Unknown',
              pubDate: item.pubDate || ''
            };
          });
        })
        .catch(function () { return []; });
    });

    return Promise.all(promises).then(function (results) {
      var allItems = [];
      results.forEach(function (arr) { allItems = allItems.concat(arr); });
      var seen = {};
      allItems = allItems.filter(function (item) {
        var key = item.title.toLowerCase().trim();
        if (seen[key]) return false;
        seen[key] = true;
        return true;
      });
      allItems.sort(function (a, b) {
        return new Date(b.pubDate).getTime() - new Date(a.pubDate).getTime();
      });
      newsCache[cat] = allItems;
    });
  }

  function fetchAllNews() {
    renderSkeletons(8);
    hideError();
    var cats = Object.keys(CATEGORIES);
    var promises = cats.map(function (cat) { return fetchCategoryNews(cat); });
    Promise.all(promises)
      .then(function () { updateRefreshTime(); renderAll(); })
      .catch(function () { showError('Some feeds could not be loaded.'); renderAll(); });
  }

  detectRegion();
  fetchAllNews();
  fetchHeadline();
  setInterval(fetchAllNews, 15 * 60 * 1000);
  setInterval(fetchHeadline, 15 * 60 * 1000);
})();
</script>
</body>
</html>
