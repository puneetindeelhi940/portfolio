<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --bg-2: #141414;
  --surface: #1a1a1a;
  --surface-2: #222222;
  --surface-3: #2a2a2a;
  --ink: #e8e8e8;
  --ink-2: #bbbbbb;
  --dim: #888888;
  --faint: #555555;
  --rule: #2a2a2a;
  --accent: #999999;
  --accent-dim: rgba(153, 153, 153, 0.12);
  --brief-bg: #141414;
  --brief-border: #2a2a2a;
  --danger: #cc4444;
  --radius: 8px;
  --radius-sm: 6px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --max-w: 1400px;
  --pad: 24px;
  --topbar-h: 56px;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.3s ease, color 0.3s ease;
}

a { color: inherit; text-decoration: none; }

/* ═══════════ TOPBAR ═══════════ */
.nt-topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 10, 10, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--rule);
  padding: 0 var(--pad);
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 16px;
  transition: background 0.3s ease;
}

.nt-back {
  font-size: 12px;
  color: var(--dim);
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  transition: color 0.2s;
}

.nt-back:hover { color: var(--accent); }

.nt-brand {
  font-size: 13px;
  font-weight: 600;
  color: var(--dim);
  white-space: nowrap;
  letter-spacing: 0.02em;
  flex-shrink: 0;
}

.nt-brand strong {
  color: var(--ink);
  font-weight: 700;
}

.nt-topbar__spacer { flex: 1; }

.nt-search {
  position: relative;
  flex: 0 1 288px;
  min-width: 160px;
}

.nt-search__icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--faint);
  pointer-events: none;
  width: 16px;
  height: 16px;
}

.nt-search__input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font-family: var(--font);
  font-size: 13px;
  padding: 8px 12px 8px 36px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
}

.nt-search__input::placeholder { color: var(--dim); }
.nt-search__input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

.nt-topbar__spacer-2 { flex: 1; }

.nt-mode-toggle {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 2px;
}

.nt-mode-toggle__label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--dim);
  cursor: pointer;
  transition: color 0.2s, background 0.2s, box-shadow 0.2s;
  padding: 5px 12px;
  border-radius: 4px;
}

.nt-mode-toggle__label:hover { color: var(--ink); }

.nt-mode-toggle__label.active {
  color: var(--ink);
  background: var(--surface-3);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
}

.nt-refreshed {
  font-size: 11px;
  color: var(--ink-2);
  white-space: nowrap;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.nt-refresh-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border: 1px solid var(--rule);
  border-radius: 5px;
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
  padding: 0;
  flex-shrink: 0;
}

.nt-refresh-btn:hover {
  color: var(--ink);
  border-color: var(--accent);
  background: var(--surface-2);
}

.nt-refresh-btn svg { transition: transform 0.5s ease; }
.nt-refresh-btn.spinning svg { animation: spin-refresh 0.6s ease; }

@keyframes spin-refresh { to { transform: rotate(360deg); } }

.nt-refreshed__dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4caf50;
  box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.25), 0 0 8px rgba(76, 175, 80, 0.9);
  margin-right: 8px;
  animation: pulse-dot 1.4s ease infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}

/* ═══════════ CHIP ROW ═══════════ */
.nt-chips-wrap {
  position: sticky;
  top: var(--topbar-h);
  z-index: 90;
  background: rgba(10, 10, 10, 0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
  transition: background 0.3s ease;
}

.nt-chips {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px var(--pad);
  max-width: var(--max-w);
  margin: 0 auto;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.nt-chips::-webkit-scrollbar { display: none; }

.nt-chip {
  appearance: none;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 20px;
  color: var(--ink-2);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 16px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.nt-chip:hover {
  background: var(--surface-2);
  border-color: var(--accent);
  color: var(--ink);
}

.nt-chip.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
  font-weight: 600;
}

.nt-chip--signals {
  background: linear-gradient(135deg, #1a3a2a, #0d2b28);
  border-color: #2e8b7a;
  color: #5fd4b8;
}

.nt-chip--signals.active {
  background: linear-gradient(135deg, #2e8b7a, #1fa874);
  border-color: #2e8b7a;
  color: #fff;
}

.nt-chip--signals:hover {
  border-color: #5fd4b8;
  color: #5fd4b8;
}

/* ═══════════ TOP ROW: HEADLINE + LATEST BRIEF ═══════════ */
.nt-top-row {
  max-width: var(--max-w);
  margin: 0 auto 0;
  padding: 44px var(--pad) 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: stretch;
}

.nt-headline {
  background: var(--brief-bg);
  border: 1px solid var(--brief-border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: row;
  transition: background 0.3s, border-color 0.3s;
  height: 100%;
}

.nt-headline__imgwrap {
  width: 44%;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background: var(--surface-2);
}

.nt-headline__img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.nt-headline__imgwrap--empty {
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--surface-2), var(--surface-3));
}

.nt-headline__placeholder-icon {
  width: 25%;
  height: 25%;
  color: var(--dim);
  opacity: 0.4;
}

.nt-headline__body {
  padding: 18px 22px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  min-width: 0;
  overflow: hidden;
}

.nt-headline__tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}

.nt-headline__title {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--ink);
  display: block;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.nt-headline__tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.nt-headline__tagchip {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-2);
  background: var(--surface-2);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 3px 8px;
}

.nt-headline__desc {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.6;
}

.nt-headline__cta {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  text-decoration: none;
  width: fit-content;
}

.nt-headline__cta:hover { text-decoration: underline; }

.nt-headline__time {
  font-size: 11px;
  color: var(--dim);
  margin-top: auto;
}

.nt-brief { height: 100%; }

.nt-brief__card {
  background: var(--brief-bg);
  border: 1px solid var(--brief-border);
  border-radius: var(--radius);
  padding: 20px 24px;
  height: 100%;
  transition: background 0.3s, border-color 0.3s;
}

.nt-brief__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.nt-brief__title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
}

.nt-brief__badge {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dim);
  padding: 3px 10px;
  border: 1px solid var(--rule);
  border-radius: 20px;
}

.nt-brief__list {
  list-style: none;
  counter-reset: brief;
}

.nt-brief__item {
  counter-increment: brief;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule);
  transition: background 0.15s;
  color: inherit;
  text-decoration: none;
}

.nt-brief__item:last-child { border-bottom: none; }

.nt-brief__item:hover {
  background: var(--accent-dim);
  margin: 0 -8px;
  padding-left: 8px;
  padding-right: 8px;
  border-radius: 4px;
}

.nt-brief__num {
  font-size: 12px;
  font-weight: 700;
  color: var(--faint);
  min-width: 20px;
  padding-top: 2px;
}

.nt-brief__num::before {
  content: counter(brief, decimal-leading-zero);
}

.nt-brief__text {
  flex: 1;
}

.nt-brief__headline {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.4;
  margin-bottom: 2px;
}

.nt-brief__source {
  font-size: 11px;
  color: var(--dim);
}

.nt-brief__skeleton {
  height: 14px;
  background: linear-gradient(110deg, var(--surface-2) 8%, var(--surface-3) 18%, var(--surface-2) 33%);
  background-size: 200% 100%;
  animation: shimmer 1.5s linear infinite;
  border-radius: 4px;
  margin-bottom: 16px;
}

.nt-brief__skeleton--short { width: 60%; }
.nt-brief__skeleton--long { width: 90%; }

/* ═══════════ MAIN GRID ═══════════ */
.nt-main {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 60px var(--pad) var(--pad);
}

.nt-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 36px 24px;
}

/* ═══════════ NEWS CARD (20% smaller) ═══════════ */
.nt-card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.3s;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

.nt-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
}

.nt-card__img {
  width: 100%;
  height: 168px;
  object-fit: cover;
  background: var(--surface-2);
}

.nt-card__body {
  padding: 12px 14px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.nt-card__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.nt-card__source {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
}

.nt-card__time {
  font-size: 10px;
  color: var(--faint);
}

.nt-card__title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--ink);
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.nt-card__desc {
  font-size: 11px;
  color: var(--dim);
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 8px;
}

.nt-card__category {
  margin-top: auto;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
  padding: 3px 8px;
  background: var(--surface-2);
  border-radius: 20px;
  align-self: flex-start;
}

/* ═══════════ SKELETON LOADER ═══════════ */
.nt-skeleton {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
}

.nt-skeleton__img {
  width: 100%;
  height: 168px;
  background: linear-gradient(110deg, var(--surface-2) 8%, var(--surface-3) 18%, var(--surface-2) 33%);
  background-size: 200% 100%;
  animation: shimmer 1.5s linear infinite;
}

.nt-skeleton__body { padding: 12px 14px; }

.nt-skeleton__line {
  height: 10px;
  background: linear-gradient(110deg, var(--surface-2) 8%, var(--surface-3) 18%, var(--surface-2) 33%);
  background-size: 200% 100%;
  animation: shimmer 1.5s linear infinite;
  border-radius: 3px;
  margin-bottom: 8px;
}

.nt-skeleton__line--short { width: 40%; }
.nt-skeleton__line--title { height: 13px; width: 90%; }
.nt-skeleton__line--med { width: 70%; }

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ═══════════ EMPTY STATE ═══════════ */
.nt-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 24px;
  color: var(--dim);
}

.nt-empty__icon {
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.4;
}

.nt-empty__title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-2);
  margin-bottom: 6px;
}

.nt-empty__desc {
  font-size: 13px;
  color: var(--faint);
  max-width: 400px;
  margin: 0 auto;
}

/* ═══════════ ERROR BANNER ═══════════ */
.nt-error {
  max-width: var(--max-w);
  margin: 12px auto;
  padding: 10px var(--pad);
  background: rgba(204, 68, 68, 0.1);
  border: 1px solid rgba(204, 68, 68, 0.3);
  border-radius: var(--radius-sm);
  color: var(--danger);
  font-size: 12px;
  display: none;
  align-items: center;
  gap: 8px;
}

.nt-error.visible { display: flex; }

/* ═══════════ FOOTER ═══════════ */
.nt-footer {
  text-align: center;
  padding: 88px var(--pad) 70px;
  color: var(--ink-2);
  font-size: 11px;
  border-top: 1px solid var(--rule);
  margin-top: 32px;
}

.nt-footer__copy {
  margin-bottom: 32px;
}

.nt-ticker {
  max-width: var(--max-w);
  margin: 0 auto;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
}

.nt-ticker__label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
  margin-bottom: 14px;
}

.nt-ticker__track {
  display: flex;
  width: max-content;
  animation: ticker-scroll 60s linear infinite;
  will-change: transform;
}

.nt-ticker__item {
  flex: 0 0 calc(var(--max-w) / 6);
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--ink-2);
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition: color 0.2s;
}

.nt-ticker__item:hover {
  color: var(--ink);
  text-decoration: underline;
}

@keyframes ticker-scroll {
  from { transform: translateX(-50%); }
  to { transform: translateX(0); }
}

/* ═══════════ RESPONSIVE ═══════════ */
@media (max-width: 768px) {
  :root { --pad: 16px; }

  .nt-topbar {
    flex-wrap: wrap;
    height: auto;
    padding: 10px var(--pad);
    gap: 8px;
  }

  .nt-search { flex: 1 1 100%; order: 10; min-width: 0; }
  .nt-topbar__spacer, .nt-topbar__spacer-2 { display: none; }

  .nt-brand { font-size: 11px; }

  .nt-grid {
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px 14px;
  }

  .nt-card__img { height: 144px; }

  .nt-top-row { grid-template-columns: 1fr; grid-template-rows: auto; }

  .nt-headline { flex-direction: column; height: auto; }
  .nt-headline__imgwrap { width: 100%; height: 180px; }

  .nt-ticker__item { flex-basis: 50vw; }
}

@media (max-width: 480px) {
  .nt-mode-toggle__label { display: none; }
  .nt-refreshed span { display: none; }
  .nt-grid { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *:not(.nt-ticker__track) { animation: none !important; transition: none !important; }
}
</style>
</head>

  </a>
  <div class="nt-brand"><strong>AI News Terminal</strong> &mdash; built by Puneet</div>

  // ── AI Signal Engine — behavioural intelligence ──
  var SIGNAL_KEY = 'nt-ai-signals';
  var SIGNAL_WINDOW = 30 * 24 * 60 * 60 * 1000;

  function loadSignals() {
    try { return JSON.parse(localStorage.getItem(SIGNAL_KEY)) || { catVisits: [], articleClicks: [], searches: [] }; }
    catch (e) { return { catVisits: [], articleClicks: [], searches: [] }; }
  }

  function saveSignals(s) {
    var cutoff = Date.now() - SIGNAL_WINDOW;
    s.catVisits = s.catVisits.filter(function (v) { return v.ts > cutoff; });
    s.articleClicks = s.articleClicks.filter(function (v) { return v.ts > cutoff; });
    s.searches = s.searches.filter(function (v) { return v.ts > cutoff; });
    try { localStorage.setItem(SIGNAL_KEY, JSON.stringify(s)); } catch (e) {}
  }

  function recordCatVisit(cat) {
    if (cat === 'signals') return;
    var s = loadSignals();
    s.catVisits.push({ cat: cat, ts: Date.now() });
    saveSignals(s);
  }

  function recordArticleClick(cat) {
    var s = loadSignals();
    s.articleClicks.push({ cat: cat, ts: Date.now() });
    saveSignals(s);
  }

  function recordSearch(q) {
    var s = loadSignals();
    s.searches.push({ q: q, ts: Date.now() });
    saveSignals(s);
  }

  function getSignalWeights() {
    var s = loadSignals();
    var now = Date.now();
    var scores = {};
    var realCats = Object.keys(CATEGORIES).filter(function (c) { return c !== 'signals'; });
    realCats.forEach(function (c) { scores[c] = 0; });

    s.catVisits.forEach(function (v) {
      var age = (now - v.ts) / (24 * 60 * 60 * 1000);
      var decay = Math.max(0, 1 - age / 30);
      scores[v.cat] = (scores[v.cat] || 0) + 3 * decay;
    });

    s.articleClicks.forEach(function (v) {
      var age = (now - v.ts) / (24 * 60 * 60 * 1000);
      var decay = Math.max(0, 1 - age / 30);
      scores[v.cat] = (scores[v.cat] || 0) + 5 * decay;
    });

    var hour = new Date().getHours();
    if (hour >= 6 && hour < 10) { scores.business = (scores.business || 0) + 1.5; scores.popular = (scores.popular || 0) + 1; }
    if (hour >= 10 && hour < 17) { scores.technology = (scores.technology || 0) + 1.2; scores.ux = (scores.ux || 0) + 1; scores.startups = (scores.startups || 0) + 0.8; }
    if (hour >= 17 && hour < 21) { scores.sports = (scores.sports || 0) + 1.5; scores.culture = (scores.culture || 0) + 1; scores.gadgets = (scores.gadgets || 0) + 1; }
    if (hour >= 21 || hour < 6) { scores.travel = (scores.travel || 0) + 1; scores.culture = (scores.culture || 0) + 0.8; }

    var weekday = new Date().getDay();
    if (weekday === 0 || weekday === 6) {
      scores.travel = (scores.travel || 0) + 1; scores.sports = (scores.sports || 0) + 1; scores.culture = (scores.culture || 0) + 0.5;
    } else {
      scores.business = (scores.business || 0) + 0.8; scores.technology = (scores.technology || 0) + 0.5;
    }

    var sorted = Object.keys(scores).sort(function (a, b) { return scores[b] - scores[a]; });
    return sorted;
  }

  function buildSignalsFeed() {
    var ranked = getSignalWeights();
    var topCats = ranked.slice(0, 5);
    var items = [];
    topCats.forEach(function (cat) {
      var cached = newsCache[cat] || [];
      cached.forEach(function (item) {
        items.push(Object.assign({}, item, { catKey: cat, catLabel: CATEGORIES[cat].label }));
      });
    });
    var seen = {};
    items = items.filter(function (item) {
      var key = item.title.toLowerCase().trim();
      if (seen[key]) return false;
      seen[key] = true;
      return true;
    });
    items.sort(function (a, b) {
      var aIdx = topCats.indexOf(a.catKey);
      var bIdx = topCats.indexOf(b.catKey);
      if (aIdx !== bIdx) return aIdx - bIdx;
      return new Date(b.pubDate).getTime() - new Date(a.pubDate).getTime();
    });
    newsCache.signals = items;
  }

  var grid       = document.getElementById('newsGrid');

  var SOURCE_URLS = {
    'BBC News': 'https://www.bbc.com/news',

  var ALL_SOURCES = (function () {
    var seen = {}; var list = [];
    Object.keys(CATEGORIES).forEach(function (cat) {
      if (cat === 'signals') return;
      CATEGORIES[cat].sources.forEach(function (s) {
        if (!seen[s]) { seen[s] = true; list.push(s); }

    return list.slice(0, 40);
  })();

  function renderTicker() {
    var html = ALL_SOURCES.map(function (s) {

    chipRow.querySelectorAll('.nt-chip').forEach(function (c) { c.classList.remove('active'); });
    chip.classList.add('active');
    activeCat = chip.dataset.cat;
    recordCatVisit(activeCat);

    renderHeadlineFromItem(null);
    renderBrief([]);
    renderSkeletons(8);

    if (activeCat === 'signals') {
      var realCats = Object.keys(CATEGORIES).filter(function (c) { return c !== 'signals'; });
      var topCats = getSignalWeights().slice(0, 5);
      Promise.all(topCats.map(function (cat) { return fetchCategoryNews(cat); }))
        .then(function () { buildSignalsFeed(); updateRefreshTime(); renderAll(); })
        .catch(function () { buildSignalsFeed(); renderAll(); });
    } else {
      fetchCategoryNews(activeCat)
        .then(function () { updateRefreshTime(); renderAll(); })
        .catch(function () { renderAll(); });
    }
  });

  // ── Search (debounced) ──
  var searchTimer;
  searchBox.addEventListener('input', function () {
    clearTimeout(searchTimer);

      searchQuery = searchBox.value.trim().toLowerCase();
      if (searchQuery.length > 2) recordSearch(searchQuery);

  // ── IP-based geolocation ──
  function detectRegion() {
    fetch('https://ipapi.co/json/')
      .then(function (r) { return r.json(); })
      .then(function (data) { if (data && data.country_code) userRegion = data.country_code; })
      .catch(function () { userRegion = 'IN'; });
  }

  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function timeAgo(dateStr) {
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return '';
    var diff = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  // ── Headline card (left of Latest Brief) — updates per category ──
  function renderHeadlineFromItem(item) {
    if (!item) {
      headlineCard.innerHTML =
        '<div class="nt-headline__imgwrap nt-headline__imgwrap--empty"><svg class="nt-headline__placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="7" y1="13" x2="17" y2="13"/><line x1="7" y1="16" x2="13" y2="16"/></svg></div>' +
        '<div class="nt-headline__body"><span class="nt-headline__tag">Loading&hellip;</span></div>';
      return;
    }
    var tagLabel = item.catLabel || (CATEGORIES[activeCat] ? CATEGORIES[activeCat].label : 'News');
    if (searchQuery) tagLabel = 'Search Result';
    var imgHtml = item.image
      ? '<div class="nt-headline__imgwrap"><img class="nt-headline__img" src="' + escapeHtml(item.image) + '" alt="" loading="lazy" onerror="this.parentElement.classList.add(\'nt-headline__imgwrap--empty\');this.remove()"></div>'
      : '<div class="nt-headline__imgwrap nt-headline__imgwrap--empty"><svg class="nt-headline__placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="7" y1="13" x2="17" y2="13"/><line x1="7" y1="16" x2="13" y2="16"/></svg></div>';
    var desc = (item.description || '').substring(0, 200);
    var cat = item.catKey || activeCat;
    headlineCard.innerHTML =
      imgHtml +
      '<div class="nt-headline__body">' +
      '<span class="nt-headline__tag">Top Story &middot; ' + escapeHtml(tagLabel) + '</span>' +
      '<a class="nt-headline__title" href="' + escapeHtml(item.url || '') + '" target="_blank" rel="noopener" data-signal-cat="' + escapeHtml(cat) + '">' + escapeHtml(item.title || '') + '</a>' +
      (desc ? '<p class="nt-headline__desc">' + escapeHtml(desc) + '</p>' : '') +
      '<a class="nt-headline__cta" href="' + escapeHtml(item.url || '') + '" target="_blank" rel="noopener" data-signal-cat="' + escapeHtml(cat) + '">Read full story &rarr;</a>' +
      '<span class="nt-headline__time">' + escapeHtml(item.source || '') + ' &middot; ' + timeAgo(item.pubDate) + '</span>' +
      '</div>';
  }

  // ── Brief rendering (top 5) ──
  function renderBrief(items) {
    var top5 = items.slice(0, 5);
    briefBadge.textContent = 'Top ' + Math.min(top5.length, 5) + ' Trending';

    if (top5.length === 0) {
      briefList.innerHTML = '';
      for (var i = 0; i < 3; i++) {
        briefList.innerHTML += '<li style="padding:8px 0;border-bottom:1px solid var(--rule)"><div class="nt-brief__skeleton nt-brief__skeleton--long"></div><div class="nt-brief__skeleton nt-brief__skeleton--short"></div></li>';
      }
      return;
    }

    briefList.innerHTML = top5.map(function (item) {
      var cat = item.catKey || activeCat;
      return '<a class="nt-brief__item" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener" data-signal-cat="' + escapeHtml(cat) + '">' +
        '<span class="nt-brief__num"></span>' +
        '<div class="nt-brief__text">' +
        '<div class="nt-brief__headline">' + escapeHtml(item.title) + '</div>' +
        '<span class="nt-brief__source">' + escapeHtml(item.source) + ' &middot; ' + timeAgo(item.pubDate) + '</span>' +
        '</div></a>';
    }).join('');
  }

  // ── Card grid rendering ──
  function renderCards(items) {
    var catLabel = CATEGORIES[activeCat] ? CATEGORIES[activeCat].label : 'News';
    if (items.length === 0 && newsCache[activeCat]) {
      grid.innerHTML = '<div class="nt-empty">' +
        '<div class="nt-empty__icon">&#128240;</div>' +
        '<div class="nt-empty__title">' + (searchQuery ? 'No matches for "' + escapeHtml(searchQuery) + '"' : 'No headlines yet') + '</div>' +
        '<div class="nt-empty__desc">' + (searchQuery ? 'Try a different search term.' : 'Check back soon — fresh news is on its way for ' + catLabel + '.') + '</div>' +
        '</div>';
      return;
    }

    if (items.length === 0) {
      renderSkeletons(8);
      return;
    }

    var remaining = items.slice(5);
    if (remaining.length === 0 && items.length <= 5) remaining = items;
    remaining = remaining.slice(0, 40);

    grid.innerHTML = remaining.map(function (item) {
      var cat = item.catKey || activeCat;
      var label = item.catLabel || catLabel;
      var imgHtml = item.image
        ? '<img class="nt-card__img" src="' + escapeHtml(item.image) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
        : '<div class="nt-card__img" style="display:flex;align-items:center;justify-content:center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--dim);opacity:0.4"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>';
      return '<a class="nt-card" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener" data-signal-cat="' + escapeHtml(cat) + '">' +
        imgHtml +
        '<div class="nt-card__body">' +
        '<div class="nt-card__meta">' +
        '<span class="nt-card__source">' + escapeHtml(item.source) + '</span>' +
        '<span class="nt-card__time">' + timeAgo(item.pubDate) + '</span>' +
        '</div>' +
        '<div class="nt-card__title">' + escapeHtml(item.title) + '</div>' +
        (item.description ? '<div class="nt-card__desc">' + escapeHtml(item.description) + '</div>' : '') +
        '<span class="nt-card__category">' + escapeHtml(label) + '</span>' +
        '</div></a>';
    }).join('');
  }

  function renderAll() {
    var items;

    if (searchQuery) {
      var allItems = [];
      var realCats = Object.keys(CATEGORIES).filter(function (c) { return c !== 'signals'; });
      realCats.forEach(function (cat) {
        (newsCache[cat] || []).forEach(function (item) {
          allItems.push(Object.assign({}, item, { catKey: cat, catLabel: CATEGORIES[cat].label }));
        });
      });
      var seen = {};
      allItems = allItems.filter(function (item) {
        var key = item.title.toLowerCase().trim();
        if (seen[key]) return false;
        seen[key] = true;
        return true;
      });
      items = allItems.filter(function (item) {
        return item.title.toLowerCase().indexOf(searchQuery) !== -1 ||
               (item.description || '').toLowerCase().indexOf(searchQuery) !== -1 ||
               (item.source || '').toLowerCase().indexOf(searchQuery) !== -1 ||
               (item.catLabel || '').toLowerCase().indexOf(searchQuery) !== -1;
      });
      items.sort(function (a, b) {
        return new Date(b.pubDate).getTime() - new Date(a.pubDate).getTime();
      });
    } else {
      items = newsCache[activeCat] || [];
    }

    if (items.length > 0) {
      renderHeadlineFromItem(items[0]);
      var rest = items.slice(1);
      renderBrief(rest);
      renderCards(rest);
    } else {
      renderHeadlineFromItem(null);
      renderBrief(items);
      renderCards(items);
    }
  }

  function renderSkeletons(count) {
    var html = '';
    for (var i = 0; i < count; i++) {
      html += '<div class="nt-skeleton">' +
        '<div class="nt-skeleton__img"></div>' +
        '<div class="nt-skeleton__body">' +
        '<div class="nt-skeleton__line nt-skeleton__line--short"></div>' +
        '<div class="nt-skeleton__line nt-skeleton__line--title"></div>' +
        '<div class="nt-skeleton__line nt-skeleton__line--med"></div>' +
        '</div></div>';
    }
    grid.innerHTML = html;
  }

  function showError(msg) { errorMsg.textContent = msg; errorBanner.classList.add('visible'); }
  function hideError() { errorBanner.classList.remove('visible'); }

  function updateRefreshTime() {
    var now = new Date();
    var timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    refreshEl.innerHTML = '<span class="nt-refreshed__dot"></span><span>Last refreshed: ' + timeStr + '</span>' +
      '<button class="nt-refresh-btn" id="refreshBtn" title="Refresh now"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg></button>';
    document.getElementById('refreshBtn').addEventListener('click', handleRefresh);
  }

  var RSS2JSON_BASE = 'https://api.rss2json.com/v1/api.json?rss_url=';

  function fetchCategoryNews(cat) {
    var feeds = RSS_FEEDS[cat] || [];
    if (feeds.length === 0) { newsCache[cat] = []; return Promise.resolve(); }

    var promises = feeds.map(function (feedUrl) {
      return fetch(RSS2JSON_BASE + encodeURIComponent(feedUrl) + '&_=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.status !== 'ok' || !data.items) return [];
          return data.items.map(function (item) {
            return {
              title: item.title || '',
              description: (item.description || '').replace(/<[^>]*>/g, '').substring(0, 200),
              url: item.link || '',
              image: item.enclosure && item.enclosure.link ? item.enclosure.link : (item.thumbnail || ''),
              source: data.feed && data.feed.title ? data.feed.title : 'Unknown',
              pubDate: item.pubDate || '',
              catKey: cat,
              catLabel: CATEGORIES[cat] ? CATEGORIES[cat].label : ''
            };
          });
        })
        .catch(function () { return []; });
    });

    return Promise.all(promises).then(function (results) {
      var allItems = [];
      results.forEach(function (arr) { allItems = allItems.concat(arr); });
      var seen = {};
      allItems = allItems.filter(function (item) {
        var key = item.title.toLowerCase().trim();
        if (seen[key]) return false;
        seen[key] = true;
        return true;
      });
      allItems.sort(function (a, b) {
        return new Date(b.pubDate).getTime() - new Date(a.pubDate).getTime();
      });
      newsCache[cat] = allItems;
    });
  }

  function fetchAllNews() {
    newsCache = {};
    renderHeadlineFromItem(null);
    renderBrief([]);
    renderSkeletons(8);
    hideError();
    var cats = Object.keys(CATEGORIES).filter(function (c) { return c !== 'signals'; });
    var promises = cats.map(function (cat) { return fetchCategoryNews(cat); });
    Promise.all(promises)
      .then(function () { buildSignalsFeed(); updateRefreshTime(); renderAll(); })
      .catch(function () { buildSignalsFeed(); showError('Some feeds could not be loaded.'); renderAll(); });
  }

  function handleRefresh() {
    var btn = document.getElementById('refreshBtn');
    if (btn) { btn.classList.add('spinning'); setTimeout(function () { btn.classList.remove('spinning'); }, 600); }
    fetchAllNews();
  }

  document.getElementById('refreshBtn').addEventListener('click', handleRefresh);

  // ── Track article clicks for signal intelligence ──
  document.addEventListener('click', function (e) {
    var link = e.target.closest('[data-signal-cat]');
    if (link) recordArticleClick(link.dataset.signalCat);
  });

  detectRegion();
  fetchAllNews();
  setInterval(fetchAllNews, 15 * 60 * 1000);
})();
</script>
</body>
