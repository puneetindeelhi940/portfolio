  window.addEventListener('error', function(e) {

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {

    const templateData = JSON.parse(templateEl.textContent);

    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');

            const reader = ds.readable.getReader();

              const { done, value } = await reader.read();

              chunks.push(value);

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    // against CDN compromise, not this), and inject the page's own

      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from

      // the user to the entry page); plain #frag scrolls in place.

            'e.preventDefault();' +

              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +

            'else scrollTo({top:0, behavior:"smooth"});' +

      // ids) before wrapping — same escape level as every sibling JSON island.

        headContent.split('</' + 'script').join('<\\/' + 'script') +

    }

      // root element. Scripts inserted via DOMParser/replaceWith are inert per

        for (const a of old.attributes) s.setAttribute(a.name, a.value);

        // which transformScriptTags handles unconditionally.

          try {

            s.textContent = await r.text();

        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.

      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }

    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

;margin:0;\">\n          My happy place is the messy front edge: GenAI personalization, behavioural‑science nudges, prompt libraries, intent estimation and multi‑modal adaptive layouts. I care deeply about people — the customers we design for and the teams who do the designing. Off the clock, you'll find me listening to spiritual discourses and chasing the next cutting‑edge idea.\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- STATS -->\n  <section style=\"background:#2B44FF;color:#fff;padding:96px 32px;\">\n    <div data-reveal-group=\"\" style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:40px 24px;\">\n      <div data-reveal=\"\" style=\"text-align:left;\">\n        <div style=\"font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(48px,7vw,96px);line-height:1;letter-spacing:-0.03em;\"><span data-count=\"19.7\" data-dec=\"1\">0<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:15px;font-weight:600;opacity:0.85;\">Years designing<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\">\n        <div style=\"font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(48px,7vw,96px);line-height:1;letter-spacing:-0.03em;\"><span data-count=\"8\">0<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:15px;font-weight:600;opacity:0.85;\">Granted patents<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\">\n        <div style=\"font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(48px,7vw,96px);line-height:1;letter-spacing:-0.03em;\"><span data-count=\"8\">0<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:15px;font-weight:600;opacity:0.85;\">Technical publications<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\">\n        <div style=\"font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(48px,7vw,96px);line-height:1;letter-spacing:-0.03em;\"><span data ce','Personalization','Design Systems','Research','Prototyping','Story-telling','GenAI','Adaptive Layouts'];\n    const colors = ['#2B44FF','#FF5436','#1FA56B','#B69CFF','#1A1712'];\n    const makePill = (txt, i) => {\n      const s = document.createElement('span');\n      s.textContent = txt;\n      s.style.cssText = `font-family:'Bricolage Grotesque';font-weight:700;font-size:clamp(26px,3.4vw,52px);letter-spacing:-0.02em;color:${colors[i % colors.length]};`;\n      return s;\n    };\n    const dot = () => { const d=document.createElement('span'); d.textContent='•'; d.style.cssText='color:#bdb6a6;font-size:28px;'; return d; };\n    q('[data-skillrow]').forEach(rowEl => {\n      skillsA.forEach((t,i)=>{ rowEl.appendChild(makePill(t,i)); rowEl.appendChild(dot()); });\n    });\n    q('[data-skillrow2]').forEach(rowEl => {\n      skillsB.forEach((t,i)=>{ rowEl.appendChild(makePill(t,i+2)); rowEl.appendChild(dot()); });\n    });\n\n    // --- marquees animation ---\n    q('[data-marquee]').forEach(m => { m.style.animation = 'marquee 26s linear infinite'; });\n    q('[data-marquee-r]').forEach(m => { m.style.animation = 'marqueeR 30s linear infinite'; });\n\n    // --- hero load-in ---\n    const heroEls = q('[data-hero]');\n    const heroPending = heroEls.filter(el => !el._heroShown);\n    heroPending.forEach((el,i) => {\n      el.style.transform = 'translateY(110%)';\n      el.style.opacity = '0';\n      el.style.transition = 'transform 0.9s cubic-bezier(0.16,1,0.3,1), opacity 0.9s ease';\n      el.style.transitionDelay = (0.15 + i*0.12) + 's';\n    });\n    heroEls.filter(el => el._heroShown).forEach(el => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; });\n    setTimeout(() => {\n      heroPending.forEach(el => { el._heroShown = true; el.style.transform = 'translateY(0)'; el.style.opacity = '1'; });\n    }, 140);\n\n    // --- scroll reveals ---\n    // NOTE: imperative el.style.opacity/transition gets clobbered by React's\n    // re-render reconciliation (the fade transition ends up permanently\n    // \"running\", stranding content at opacity 0). The Web Animations API runs\n    // independently of React's style reconciliation, so we use el.animate()\n    // for the reveal and keep the element's resting opacity at 1.\n    const reveals = q('[data-reveal]');\n    // stagger reveal-group children\n    q('[data-reveal-group]').forEach(group => {\n      Array.from(group.querySelectorAll('[data-reveal]')).forEach((el,i)=>{ el.dataset.delay = (i*0.08).toFixed(2); });\n    });\n    const standaloneCounters = q('[data-count]').filter(c => !c.closest('[data-reveal]'));\n    const revealEl = (el) => {\n      if (el._shown) return; el._shown = true;\n      const d = el.dataset.delay ? parseFloat(el.dataset.delay) : 0;\n      try {\n        const anim = el.animate(\n          [{ opacity: 0, transform: 'translateY(48px)' }, { opacity: 1, transform: 'translateY(0)' }],\n          { duration: 800, delay: d * 1000, easing: 'cubic-bezier(0.16,1,0.3,1)', fill: 'none' }\n        );\n        el._revealAnim = anim;\n        // Safety: if the document timeline is throttled/frozen (can happen in\n        // scaled/bundled contexts), the animation can stall at opacity 0. Drop\n        // it after its nominal lifetime so the element returns to its resting\n        // opacity (1). The element is never left invisible.\n        setTimeout(() => { try { anim.cancel(); } catch (e) {} }, 900 + d * 1000);\n      } catch (e) {}\n      el.querySelectorAll('[data-count]').forEach(c => this.runCount(c));\n    };\n    // Failsafe: guarantee everything is revealed shortly after load no matter what,\n    // and cancel any stalled animations so nothing is stuck hidden.\n    this._revealAllNow = () => {\n      reveals.forEach(el => {\n        if (!el._shown) revealEl(el);\n        if (el._revealAnim) { try { el._revealAnim.cancel(); } catch (e) {} }\n      });\n      standaloneCounters.forEach(c => this.runCount(c));\n    };\n    setTimeout(() => { if (this._revealAllNow) this._revealAllNow(); }, 1800);\n    this._checkReveals = () => {\n      const vh = window.innerHeight;\n      reveals.forEach(el => {\n        if (el._shown) return;\n        const r = el.getBoundingClientRect();\n        if (r.top < vh * 0.9) revealEl(el);\n      });\n      standaloneCounters.forEach(c => {\n        if (c._done) return;\n        const r = c.getBoundingClientRect();\n        if (r.top < vh * 0.78) this.runCount(c);\n      });\n    };\n\n    // --- parallax on scroll ---\n    const px = q('[data-parallax]');\n    const onScroll = () => {\n      const vh = window.innerHeight;\n      px.forEach(el => {\n        const r = el.getBoundingClientRect();\n        const center = r.top + r.height/2;\n        const rel = (center - vh/2) / vh;\n        const speed = parseFloat(el.dataset.parallax) || 0.2;\n        el.style.transform = `translate3d(0, ${(-rel*speed*120).toFixed(1)}px, 0)`;\n      });\n      if (this._checkReveals) this._checkReveals();\n    };\n    window.addEventListener('scroll', onScroll, { passive:true });\n    onScroll();\n    this._onScroll = onScroll;\n    if (this._checkReveals) this._checkReveals();\n\n    // --- hero pupils follow cursor + custom cursor + magnetic ---\n    const pupils = q('[data-pupil]');\n    const cursor = root.querySelector('[data-cursor]');\n    let cx = window.innerWidth/2, cy = window.innerHeight/2, tx = cx, ty = cy;\n    const magnets = q('[data-magnetic]');\n    const onMove = (ev) => {\n      tx = ev.clientX; ty = ev.clientY;\n      pupils.forEach(p => {\n        const cxx = p.dataset.cx || (p.dataset.cx = p.getAttribute('cx'));\n        const cyy = p.dataset.cy || (p.dataset.cy = p.getAttribute('cy'));\n        const rect = p.ownerSVGElement.getBoundingClientRect();\n        const px0 = rect.left + (parseFloat(cxx)/240)*rect.width;\n        const py0 = rect.top + (parseFloat(cyy)/270)*rect.height;\n        const ang = Math.atan2(ev.clientY - py0, ev.clientX - px0);\n        p.setAttribute('cx', parseFloat(cxx) + Math.cos(ang)*7);\n        p.setAttribute('cy', parseFloat(cyy) + Math.sin(ang)*7);\n      });\n      magnets.forEach(m => {\n        const r = m.getBoundingClientRect();\n        const mx = ev.clientX - (r.left + r.width/2);\n        const my = ev.clientY - (r.top + r.height/2);\n        const dist = Math.hypot(mx, my);\n        if (dist < 110) { m.style.transform = `translate(${mx*0.28}px, ${my*0.28}px)`; }\n        else { m.style.transform = 'translate(0,0)'; }\n      });\n    };\n    magnets.forEach(m => { m.style.transition = 'transform 0.25s cubic-bezier(0.16,1,0.3,1), background 0.2s, color 0.2s'; });\n    window.addEventListener('mousemove', onMove, { passive:true });\n    this._onMove = onMove;\n\n    // cursor lerp\n    if (cursor) {\n      const interactive = q('a, [data-magnetic], [data-exp]');\n      interactive.forEach(el => {\n        el.addEventListener('mouseenter', () => { cursor.style.width='56px'; cursor.style.height='56px'; cursor.style.background='#fff'; });\n        el.addEventListener('mouseleave', () => { cursor.style.width='34px'; cursor.style.height='34px'; cursor.style.background='transparent'; });\n      });\n      const loop = () => {\n        cx += (tx - cx)*0.18; cy += (ty - cy)*0.18;\n        cursor.style.left = cx + 'px'; cursor.style.top = cy + 'px';\n        this._raf = requestAnimationFrame(loop);\n      };\n      loop();\n    }\n  }\n\n  runCount(el) {\n    const target = parseFloat(el.dataset.count);\n    const dec = el.dataset.dec ? parseInt(el.dataset.dec) : 0;\n    const finalStr = dec ? target.toFixed(dec) : Math.round(target).toString();\n    if (el._done) { el.textContent = finalStr; return; }\n    el._done = true;\n    // Fallback: if rAF is throttled/frozen (scaled/bundled contexts), force the\n    // final value so the number is never stuck at 0.\n    setTimeout(() => { el.textContent = finalStr; }, 1700);\n    const dur = 1500; const start = performance.now();\n    const tick = (now) => {\n      const t = Math.min((now - start)/dur, 1);\n      const eased = 1 - Math.pow(1 - t, 3);\n      const val = target * eased;\n      el.textContent = dec ? val.toFixed(dec) : Math.round(val).toString();\n      if (t < 1) requestAnimationFrame(tick);\n      else el.textContent = dec ? target.toFixed(dec) : Math.round(target).toString();\n    };\n    requestAnimationFrame(tick);\n  }\n\n  componentWillUnmount() {\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._onMove) window.removeEventListener('mousemove', this._onMove);\n    if (this._raf) cancelAnimationFrame(this._raf);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"Puneet Arora - Portfolio.dc"}
